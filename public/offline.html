<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b12" />
    <title>Bağlantı gerekli · Şafak Savaşçıları</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Manrope, system-ui, sans-serif;
        background: #080b12;
        color: #f4ead8;
      }
      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(420px, 100%);
        padding: 32px 26px;
        border: 1px solid rgba(212, 177, 111, .45);
        background: linear-gradient(145deg, rgba(30, 25, 25, .98), rgba(10, 12, 18, .98));
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        color: #f3dfb5;
        font: 700 25px/1.2 Georgia, serif;
      }
      p {
        margin: 0 0 24px;
        color: #c7bcaa;
        line-height: 1.6;
      }
      button {
        min-height: 48px;
        padding: 0 24px;
        border: 1px solid #d4b16f;
        border-radius: 4px;
        background: linear-gradient(110deg, #d5a95d, #9c612e);
        color: #17120d;
        font: 800 13px/1 Manrope, system-ui, sans-serif;
        letter-spacing: .12em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Yolculuk için bağlantı gerekli</h1>
      <p>Şafak Savaşçıları çevrimiçi çalışır. İnternet bağlantını kontrol edip yeniden dene.</p>
      <button type="button" onclick="location.reload()">YENİDEN DENE</button>
    </main>
  </body>
</html>
