<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#d9f2ed" />
    <title>Bağlantı gerekli · Sunvoria</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Manrope, system-ui, sans-serif;
        background: linear-gradient(145deg, #e5f4ed, #f8f3dc);
        color: #25423d;
      }
      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(420px, 100%);
        padding: 32px 26px;
        border: 1px solid rgba(93, 143, 130, .3);
        border-radius: 24px;
        background: rgba(255, 255, 255, .88);
        box-shadow: 0 24px 70px rgba(54, 102, 92, .16);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        color: #265d55;
        font: 700 25px/1.2 Georgia, serif;
      }
      p {
        margin: 0 0 24px;
        color: #617d75;
        line-height: 1.6;
      }
      button {
        min-height: 48px;
        padding: 0 24px;
        border: 1px solid #5f9f8b;
        border-radius: 14px;
        background: linear-gradient(110deg, #a9d77d, #5fa88e);
        color: #12392f;
        font: 800 13px/1 Manrope, system-ui, sans-serif;
        letter-spacing: .12em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Yolculuk için bağlantı gerekli</h1>
      <p>Sunvoria çevrimiçi çalışır. İnternet bağlantını kontrol edip yeniden dene.</p>
      <button type="button" onclick="location.reload()">YENİDEN DENE</button>
    </main>
  </body>
</html>
