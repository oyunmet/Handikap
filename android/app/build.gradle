plugins {
    id "com.android.application"
}

def appPackage = new groovy.json.JsonSlurper().parse(file("../../package.json"))
def androidVersionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()
def releaseKeyPath = System.getenv("ANDROID_KEYSTORE_PATH")

android {
    namespace "com.safaksavascilari.game"
    compileSdk 36

    defaultConfig {
        applicationId "com.safaksavascilari.game"
        minSdk 24
        targetSdk 36
        versionCode androidVersionCode
        versionName appPackage.version
    }

    signingConfigs {
        release {
            if (releaseKeyPath) {
                storeFile file(releaseKeyPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeyPath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.7.4"
}
